services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentacar
      POSTGRES_PASSWORD: rentacar
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rentacar']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rentacar
      RABBITMQ_DEFAULT_PASS: rentacar
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rentacar
      MINIO_ROOT_PASSWORD: rentacar123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  auth-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_auth?schema=public
      PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-minimum-32-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-minimum-32-characters}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  car-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/car-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_car?schema=public
      PORT: 3002
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-minimum-32-characters}
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
      STORAGE_ENABLED: 'true'
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: rentacar
      MINIO_SECRET_KEY: rentacar123
      MINIO_BUCKET: rentacar-cars
      MINIO_PUBLIC_URL: http://localhost:9000/rentacar-cars
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  booking-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/booking-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_booking?schema=public
      PORT: 3003
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-minimum-32-characters}
      DEFAULT_CLEANING_BUFFER_HOURS: 2
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      SETTINGS_SERVICE_URL: http://settings-service:3011
      PRICING_SERVICE_URL: http://pricing-service:3004
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_started
      settings-service:
        condition: service_started
      pricing-service:
        condition: service_started

  pricing-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/pricing-service
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_pricing?schema=public
      PORT: 3004
    ports:
      - '3004:3004'
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/customer-service
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_customer?schema=public
      PORT: 3005
    ports:
      - '3005:3005'
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/payment-service
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_payment?schema=public
      PORT: 3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret-change-in-production}
    ports:
      - '3006:3006'
    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_started

  search-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/search-service
    environment:
      PORT: 3010
      CAR_SERVICE_URL: http://car-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
      PRICING_SERVICE_URL: http://pricing-service:3004
    ports:
      - '3010:3010'
    depends_on:
      - car-service
      - booking-service
      - pricing-service

  settings-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/settings-service
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_settings?schema=public
      PORT: 3011
    ports:
      - '3011:3011'
    depends_on:
      postgres:
        condition: service_healthy

  finance-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/finance-service
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_finance?schema=public
      PORT: 3007
    ports:
      - '3007:3007'
    depends_on:
      postgres:
        condition: service_healthy

  maintenance-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/maintenance-service
    environment:
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_maintenance?schema=public
      PORT: 3008
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
    ports:
      - '3008:3008'
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: services/notification-service
    environment:
      PORT: 3009
      DATABASE_URL: postgresql://rentacar:rentacar@postgres:5432/rentacar_notification?schema=public
      RABBITMQ_URL: amqp://rentacar:rentacar@rabbitmq:5672
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
    ports:
      - '3009:3009'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nest
      args:
        SERVICE_PATH: apps/api-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      CAR_SERVICE_URL: http://car-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
      PRICING_SERVICE_URL: http://pricing-service:3004
      CUSTOMER_SERVICE_URL: http://customer-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
      FINANCE_SERVICE_URL: http://finance-service:3007
      MAINTENANCE_SERVICE_URL: http://maintenance-service:3008
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      SEARCH_SERVICE_URL: http://search-service:3010
      SETTINGS_SERVICE_URL: http://settings-service:3011
    ports:
      - '3000:3000'
    depends_on:
      - auth-service
      - car-service
      - booking-service
      - pricing-service
      - customer-service
      - payment-service
      - search-service
      - settings-service
      - finance-service
      - maintenance-service
      - notification-service

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  minio_data:
