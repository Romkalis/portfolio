name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'projects/rentacar/**'
  pull_request:
    paths:
      - 'projects/rentacar/**'

defaults:
  run:
    working-directory: projects/rentacar

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/rentacar/package-lock.json

      - name: Install
        run: npm install

      - name: Build packages
        run: |
          npm run build --workspace=@rentacar/shared-types
          npm run build --workspace=@rentacar/shared-utils
          npm run build --workspace=@rentacar/prisma

      - name: Generate Prisma clients
        run: npm run db:generate

      - name: Lint
        run: npm run lint --if-present || true

      - name: Typecheck
        run: npm run typecheck --if-present || true

      - name: Build auth-service
        run: npm run build --workspace=@rentacar/auth-service

      - name: Build api-gateway
        run: npm run build --workspace=@rentacar/api-gateway

      - name: Build car-service
        run: npm run build --workspace=@rentacar/car-service

      - name: Build booking-service
        run: npm run build --workspace=@rentacar/booking-service

      - name: Build pricing-service
        run: npm run build --workspace=@rentacar/pricing-service

      - name: Build customer-service
        run: npm run build --workspace=@rentacar/customer-service

      - name: Build finance-service
        run: npm run build --workspace=@rentacar/finance-service

      - name: Build maintenance-service
        run: npm run build --workspace=@rentacar/maintenance-service

      - name: Build notification-service
        run: npm run build --workspace=@rentacar/notification-service

      - name: Build search-service
        run: npm run build --workspace=@rentacar/search-service

      - name: Build payment-service
        run: npm run build --workspace=@rentacar/payment-service

      - name: Build settings-service
        run: npm run build --workspace=@rentacar/settings-service

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Compose config validate
        run: docker compose -f infra/docker/docker-compose.yml config
        working-directory: projects/rentacar
